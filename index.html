<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f8f1e7">
<title>দুর্গা সমিতি</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;500;600;700;800&display=swap');
:root{--cream:#fbf6ed;--paper:#fffdf9;--red:#a9162b;--red2:#c42c40;--gold:#d7a52b;--navy:#101d39;--blue:#1e3764;--ink:#28251f;--muted:#77736b;--line:#eadfce;--green:#17784c;--danger:#b42332;--shadow:0 12px 32px #4b2b1412}
*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font-family:'Noto Sans Bengali',system-ui,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0;border-radius:10px;padding:10px 14px;background:var(--red);color:white;font-weight:700}button:hover{filter:brightness(1.05)}button.secondary{background:#f2e7d6;color:#5e342c;border:1px solid var(--line)}button.dark{background:var(--navy)}button.danger{background:#fff0f0;color:#a3162b;border:1px solid #f0c8cd}button.small{padding:6px 9px;font-size:13px}.hidden{display:none!important}.muted{color:var(--muted)}.tiny{font-size:12px}.wrap{max-width:1200px;margin:auto;padding:18px}.brand{display:flex;align-items:center;gap:14px}.brand img{width:68px;height:68px;object-fit:contain;border-radius:50%;background:white}.brand h1{font-size:clamp(22px,4vw,34px);margin:0;color:var(--red);font-weight:800}.brand p{margin:3px 0 0;color:#876a39;font-size:13px}.top{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;padding:15px 0 20px}.card{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:var(--shadow)}.login-layout{min-height:100vh;display:grid;place-items:center;padding:22px;background:radial-gradient(circle at 50% 5%,#fff 0,#fbf4e8 55%,#f4e7d5 100%)}.login-card{width:min(100%,470px);padding:28px}.login-card .brand{justify-content:center;flex-direction:column;text-align:center}.login-card .brand img{width:104px;height:104px}.login-card h2{text-align:center;margin:24px 0 8px}.field{display:grid;gap:6px;margin:14px 0}.field label{font-weight:700;font-size:14px}.field input,.field select,.field textarea,input.search,select.inline{width:100%;padding:11px 12px;border:1px solid #d9cbb7;border-radius:10px;background:#fff;color:#28251f;outline:none}.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--gold);box-shadow:0 0 0 3px #d7a52b22}.login-card button[type=submit]{width:100%;padding:13px}.notice{padding:11px 13px;border-radius:10px;margin:12px 0;font-size:14px}.notice.error{background:#fff0f0;color:#a3162b;border:1px solid #f0c8cd}.notice.success{background:#edf9f1;color:#176a43;border:1px solid #c8e8d3}.notice.info{background:#f0f4ff;color:#243e75;border:1px solid #d8e0fb}.demo-box{margin-top:18px;background:#fff7e9;border:1px dashed #d7b15a;border-radius:12px;padding:12px;font-size:13px}.app{min-height:100vh}.apphead{background:var(--navy);color:white;padding:14px 20px;display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap}.apphead .brand h1{color:#fff}.apphead .brand p{color:#e8cc80}.apphead .brand img{width:54px;height:54px}.apphead button{background:#253e6d}.layout{display:grid;grid-template-columns:minmax(0,1fr);gap:18px;max-width:1450px;margin:auto;padding:18px}.sidebar{display:none;background:var(--navy);color:white;border-radius:18px;padding:14px;height:max-content;position:sticky;top:12px}.layout.sidebar-open{grid-template-columns:245px minmax(0,1fr)}.layout.sidebar-open .sidebar{display:block}.logo-menu-toggle{border:0!important;background:transparent!important;color:inherit!important;padding:0!important;text-align:left;cursor:pointer}.logo-menu-toggle:hover{filter:brightness(1.1)}.logo-menu-toggle:focus-visible{outline:2px solid #e8cc80;outline-offset:4px}.sidebar button{display:block;width:100%;text-align:left;margin:5px 0;background:transparent;color:#e9eef8;border:1px solid transparent}.sidebar button.active,.sidebar button:hover{background:#263e6c;border-color:#43629a}.sidebar .admin-tag{font-size:12px;color:#e6c86d;padding:8px}.content{min-width:0}.page-title{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:0 0 16px}.page-title h2{margin:0;color:var(--navy);font-size:24px}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:16px}.stat{border-radius:15px;padding:16px;color:white;background:linear-gradient(135deg,#203c70,#101d39);box-shadow:var(--shadow)}.stat:nth-child(2){background:linear-gradient(135deg,#17784c,#0d5535)}.stat:nth-child(3){background:linear-gradient(135deg,#a9162b,#731125)}.stat:nth-child(4){background:linear-gradient(135deg,#bd8a18,#8a5e08)}.stat span{font-size:13px;opacity:.9}.stat strong{display:block;font-size:26px;margin-top:6px}.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:12px}table{border-collapse:collapse;width:100%;min-width:650px;background:#fff}th,td{padding:11px 12px;text-align:left;border-bottom:1px solid #eee5d8;font-size:13px;vertical-align:middle}th{background:#f4ead9;color:#5c3c27;white-space:nowrap}tr:last-child td{border-bottom:0}.pill{display:inline-block;border-radius:999px;padding:4px 9px;font-size:12px;background:#edf9f1;color:#176a43}.pill.off{background:#fff0f0;color:#a3162b}.rowtools{display:flex;gap:7px;flex-wrap:wrap}.toolbar{display:flex;gap:9px;flex-wrap:wrap;align-items:center;margin-bottom:14px}.toolbar input,.toolbar select{max-width:260px}.profile-head{text-align:center;padding:25px}.avatar{width:100px;height:100px;border-radius:50%;object-fit:cover;border:4px solid var(--gold);background:#f4e8d6}.profile-head h2{color:var(--red);margin:12px 0 5px}.detailgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.detail{padding:12px;background:#fff8ef;border-radius:10px;border:1px solid var(--line)}.detail b{display:block;font-size:12px;color:#876a39;margin-bottom:5px}.chatbox{height:55vh;min-height:300px;overflow:auto;background:#f6f0e7;border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px}.bubble{max-width:80%;padding:10px 12px;border-radius:14px;background:white;align-self:flex-start;box-shadow:0 2px 5px #0000000a}.bubble.mine{align-self:flex-end;background:#d9f4d7}.bubble small{display:block;color:#777;font-size:11px;margin-top:5px}.bubble .modtools{margin-top:7px;display:flex;gap:5px}.gallery{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.gallery-item{border:1px solid var(--line);border-radius:13px;overflow:hidden;background:white}.gallery-item img{width:100%;height:160px;object-fit:cover;background:#f4ead9}.gallery-item .caption{padding:10px}.money{font-variant-numeric:tabular-nums}.empty{padding:26px;text-align:center;color:var(--muted)}.settings-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.footer{text-align:center;padding:22px;color:#8b8173;font-size:12px}.filepreview{max-width:100%;max-height:150px;object-fit:contain}.menu-mobile{display:none}.linkbtn{background:none;color:var(--red);padding:0;text-decoration:underline}.checkrow{display:flex;gap:8px;align-items:center}.checkrow input{width:auto}.export-area{white-space:pre-wrap;overflow-wrap:anywhere;background:#f6f0e7;border-radius:10px;padding:10px;font-size:12px}
@media(max-width:850px){.layout{grid-template-columns:1fr;padding:10px}.layout.sidebar-open{grid-template-columns:1fr}.sidebar{position:static;display:none;overflow:auto;gap:5px;padding:8px}.layout.sidebar-open .sidebar{display:flex}.sidebar button{white-space:nowrap;width:auto;margin:0}.sidebar .admin-tag{display:none}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.grid2,.settings-grid{grid-template-columns:1fr}.gallery{grid-template-columns:repeat(2,minmax(0,1fr))}.apphead{padding:12px}.apphead .brand img{width:44px;height:44px}}@media(max-width:480px){.wrap{padding:12px}.login-card{padding:20px}.brand img{width:54px;height:54px}.stats{gap:8px}.stat{padding:12px}.stat strong{font-size:22px}.gallery{grid-template-columns:1fr}.detailgrid{grid-template-columns:1fr}.page-title h2{font-size:20px}.apphead .brand p{display:none}.card{padding:14px}}

.bill-category-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin:18px 0}.bill-category{display:flex;flex-direction:column;align-items:flex-start;gap:8px;text-align:left;padding:20px;border:1px solid var(--line);border-radius:16px;background:var(--panel);color:var(--text);min-height:130px;cursor:pointer}.bill-category b{font-size:1rem}.bill-category span{font-size:.86rem;opacity:.8}.bill-category.active{outline:2px solid var(--accent)}.neighborhood-row{display:grid;grid-template-columns:2fr 1fr 1fr auto;gap:8px;align-items:center;padding:10px;border-bottom:1px solid var(--line)}.neighborhood-row input{min-width:0;width:100%}@media(max-width:700px){.bill-category-grid{grid-template-columns:1fr}.neighborhood-row{grid-template-columns:1fr 1fr}.neighborhood-row button{grid-column:span 2}}
 .bill-category.active{outline:2px solid var(--primary);background:var(--soft)}
@media(max-width:600px){#transactionTable table th,#transactionTable table td{padding:8px 6px;font-size:13px}.bill-category-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="root"></div>
<script src="js/config.js"></script>
<script src="js/app.js" defer></script>
</body>
</html>
